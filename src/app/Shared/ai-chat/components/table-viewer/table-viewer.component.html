<p-card *ngIf="data?.length" class="table-card">
  <ng-template pTemplate="header">
    <div class="card-header">
      <span class="card-title">Table Data</span>
      <button
        pButton
        icon="pi pi-external-link"
        class="p-button-rounded p-button-text p-button-sm"
        (click)="openPreview()"
        pTooltip="Expand Table"
        tooltipPosition="left"
      ></button>
    </div>
  </ng-template>

  <p-table
    [value]="data"
    [paginator]="data.length > 10"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    [responsive]="true"
    styleClass="p-datatable-sm p-datatable-striped"
    [scrollable]="true"
    scrollHeight="400px"
  >
    <ng-template pTemplate="header">
      <tr>
        <th *ngFor="let col of columns" [pSortableColumn]="col">
          {{ col }}
          <p-sortIcon [field]="col"></p-sortIcon>
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td *ngFor="let col of columns">{{ formatValue(row[col]) }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="columns.length" class="text-center">
          No data available
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<!-- Preview Modal -->
<p-dialog
  [(visible)]="showPreview"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [maximizable]="true"
  [style]="{ width: '90vw', height: '85vh' }"
  styleClass="table-preview-dialog"
  header="Table Preview"
>
  <p-table
    *ngIf="data?.length"
    [value]="data"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [responsive]="true"
    styleClass="p-datatable-sm p-datatable-striped"
    [scrollable]="true"
    scrollHeight="calc(85vh - 180px)"
    [globalFilterFields]="columns"
  >
    <ng-template pTemplate="header">
      <tr>
        <th *ngFor="let col of columns" [pSortableColumn]="col">
          {{ col }}
          <p-sortIcon [field]="col"></p-sortIcon>
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td *ngFor="let col of columns">{{ formatValue(row[col]) }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
